apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-deployment-{uuid}
  namespace: shengsuanyun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-{uuid}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: openclaw-{uuid}
    spec:
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

      initContainers:
        - name: init-config
          image: registry.shengsuanyun.com/base/busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e

              mkdir -p /openclaw-home
              mkdir -p /openclaw-home/agents/main/agent
              mkdir -p /openclaw-home/workspace

              cp /secret-config/openclaw.json /openclaw-home/openclaw.json
              chmod 600 /openclaw-home/openclaw.json

              cp /secret-config/auth-profiles.json /openclaw-home/agents/main/agent/auth-profiles.json
              chmod 600 /openclaw-home/agents/main/agent/auth-profiles.json

              chown -R 0:0 /openclaw-home
              chmod -R u+rwX /openclaw-home
          volumeMounts:
            - name: config-volume
              mountPath: /secret-config
              readOnly: true
            - name: openclaw-data-pvc
              mountPath: /openclaw-home

      containers:
        - name: openclaw
          image: registry.shengsuanyun.com/shengsuanyun/openclaw:preview-skill
          imagePullPolicy: Always
          env:
            - name: OPENCLAW_HOME
              value: /root/.openclaw
            - name: NODE_ENV
              value: production
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            # SSH 配置（从 k8s Secret 传入，按需启用）
            - name: SSH_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openclaw-ssh-secret
                  key: SSH_ROOT_PASSWORD
                  optional: true
            - name: SSH_AUTHORIZED_KEYS
              valueFrom:
                secretKeyRef:
                  name: openclaw-ssh-secret
                  key: SSH_AUTHORIZED_KEYS
                  optional: true
            # 持久化 SSH 主机密钥目录（存于 PVC，避免 Pod 重启后客户端 host key 告警）
            - name: SSH_HOST_KEYS_DIR
              value: /root/.openclaw/ssh-host-keys
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: openclaw-data-pvc
              mountPath: /root/.openclaw

      restartPolicy: Always
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30

      tolerations:
        - key: workload-type
          operator: Equal
          value: openclaw
          effect: NoSchedule

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - openclaw

      volumes:
        - name: config-volume
          secret:
            secretName: openclaw-config
            defaultMode: 0600
        - name: openclaw-data-pvc
          persistentVolumeClaim:
            claimName: openclaw-pvc-{uuid}
